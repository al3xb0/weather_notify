name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: weather
          POSTGRES_DB: weather_notify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather -d weather_notify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://weather:weather@localhost:5432/weather_notify?schema=public
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://localhost:5672
      JWT_ACCESS_SECRET: ci-access-secret-0123456789-abcdefghij
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789-abcdefghij

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # An advisory reaches production through the lockfile rather than through
      # a diff, so no other step in this job would ever fail because of one.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      # The committed document is what the frontend generates its types from,
      # so a controller change that is not reflected there fails here rather
      # than silently shipping a stale client contract.
      - name: OpenAPI document is up to date
        run: npm run openapi:check

      - name: Build all apps
        run: npm run build:all

      - name: Unit tests
        run: npm run test:cov

      - name: E2E tests
        run: npm run test:e2e

  # The suites above run everything against ports and fakes, which cannot catch
  # a wrong queue argument or a container that never reaches readiness. This job
  # boots the real compose stack and asserts both.
  smoke:
    runs-on: ubuntu-latest

    # Interpolated into the compose file, which has no default for these any
    # more. The shell environment wins over .env, so setting them here is all
    # that is needed — and a job that forgets to fails at `up` rather than at
    # the Grafana assertions further down.
    env:
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: ci-grafana-password

    steps:
      - uses: actions/checkout@v4

      - name: Write .env for compose
        run: |
          cp .env.example .env
          sed -i 's|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET="ci-access-secret-0123456789-abcdefghij"|' .env
          sed -i 's|^JWT_REFRESH_SECRET=.*|JWT_REFRESH_SECRET="ci-refresh-secret-0123456789-abcdefghij"|' .env

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      # `up --wait` already gates on the healthchecks, which hit /ready. Asserting
      # it again from inside each container makes the failure legible when a
      # dependency, not the process, is what is down.
      - name: Every service reports ready
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/health
          docker compose exec -T core-api wget -qO- http://localhost:3004/ready
          docker compose exec -T watcher  wget -qO- http://localhost:3002/ready
          docker compose exec -T notifier wget -qO- http://localhost:3003/ready

      - name: Retry and dead-letter topology exists in RabbitMQ
        run: |
          set -euo pipefail
          # Queues are declared when the notifier's channel finishes its setup,
          # which can trail readiness by a moment.
          for attempt in $(seq 1 15); do
            queues=$(docker compose exec -T rabbitmq rabbitmqctl list_queues name --formatter json || echo '[]')
            echo "$queues" | grep -q 'notifications.email.dead' && break
            sleep 2
          done
          echo "$queues"
          missing=0
          for channel in telegram email push; do
            for suffix in "" ".retry.1" ".retry.2" ".retry.3" ".dead"; do
              name="notifications.${channel}${suffix}"
              echo "$queues" | grep -q "\"${name}\"" || { echo "missing queue ${name}"; missing=1; }
            done
          done
          [ "$missing" = "0" ]

      - name: The API is actually usable
        run: |
          set -euo pipefail
          token=$(curl -fsS -X POST http://localhost:3000/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"smoke@example.com","password":"sm0ke-Passw0rd!"}' \
            | jq -er .accessToken)
          curl -fsS http://localhost:3000/users/me -H "authorization: Bearer $token" | jq -e '.email == "smoke@example.com"'
          # Unverified users must not be able to arm alerts — the soft-gate is
          # policy, so a green path here would hide a real regression.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/triggers \
            -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"name":"Heat","city":"Berlin","latitude":52.52,"longitude":13.405,"channels":["EMAIL"],"conditions":[{"metric":"TEMPERATURE","operator":"GT","threshold":30}]}')
          [ "$status" = "403" ] || { echo "expected 403 for an unverified user, got $status"; exit 1; }

      # A backup nobody has restored is a hypothesis, and one nobody has taken
      # is not even that. This runs the real dump against the real database and
      # then restores it into a scratch schema, so both halves of the recovery
      # path are exercised rather than assumed.
      - name: Backups can be taken and restored
        run: |
          set -euo pipefail
          docker compose exec -T db-backup /scripts/backup.sh once
          # Newest, by mtime. The sidecar has already written one on start, and
          # `ls -1` sorts ascending — so taking the first file restored the older
          # dump and left the one this step just produced unexercised.
          dump=$(docker compose exec -T db-backup sh -c 'ls -1t /backups/*.dump | head -1' | tr -d '\r')
          [ -n "$dump" ] || { echo "no dump was written"; exit 1; }

          docker compose exec -T postgres \
            psql -U weather -d postgres -c 'CREATE DATABASE restore_drill'
          docker compose exec -T -e RESTORE_TARGET_DB=restore_drill db-backup \
            /scripts/restore.sh "$dump"
          # The restored copy has to contain the schema, not merely load without
          # error — an empty database restores cleanly too.
          docker compose exec -T postgres psql -U weather -d restore_drill \
            -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" \
            | tr -d '\r' | { read -r tables; [ "$tables" -gt 5 ] || { echo "restored schema looks empty: $tables tables"; exit 1; }; }

      # Metrics that nothing scrapes are a design, not an operation. This proves
      # every target is actually being collected and that the alert rules load
      # — a typo in a PromQL expression is otherwise invisible until the day the
      # rule was supposed to fire.
      - name: Prometheus scrapes every service and loads the rules
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            up=$(curl -fsS 'http://localhost:9090/api/v1/query?query=up' | jq '[.data.result[] | select(.value[1] == "1")] | length')
            # core-api, watcher, notifier, rabbitmq, prometheus itself.
            [ "$up" -ge 5 ] && break
            sleep 3
          done
          curl -fsS 'http://localhost:9090/api/v1/targets' | jq -e '
            [.data.activeTargets[] | select(.health != "up")] | length == 0
          ' || { curl -sS http://localhost:9090/api/v1/targets | jq '.data.activeTargets[] | {job: .labels.job, health, lastError}'; exit 1; }
          # Rules are parsed at load, so a broken expression shows up as a group
          # that never appears rather than as a startup failure.
          curl -fsS 'http://localhost:9090/api/v1/rules' \
            | jq -e '[.data.groups[].rules[] | select(.name == "OutboxBacklogGrowing")] | length == 1'

      # A rule that fires and reaches nobody is the failure the alerting stack
      # exists to prevent, and it looks exactly like a healthy system. This
      # asserts Prometheus actually discovered Alertmanager and that
      # Alertmanager parsed its rendered config.
      - name: Prometheus is wired to Alertmanager
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            curl -fsS http://localhost:9093/-/ready >/dev/null 2>&1 && break
            sleep 3
          done
          curl -fsS 'http://localhost:9090/api/v1/alertmanagers' \
            | jq -e '.data.activeAlertmanagers | length == 1'
          # The route tree comes from the template that entrypoint.sh renders,
          # so this also proves the substitution produced valid YAML.
          curl -fsS 'http://localhost:9093/api/v2/status' \
            | jq -e '.config.original | contains("group_by")'

      - name: Grafana provisions its datasource and dashboard
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            curl -fsS http://localhost:3005/api/health >/dev/null 2>&1 && break
            sleep 3
          done
          curl -fsS -u "$GRAFANA_USER:$GRAFANA_PASSWORD" http://localhost:3005/api/datasources | jq -e '.[0].type == "prometheus"'
          curl -fsS -u "$GRAFANA_USER:$GRAFANA_PASSWORD" http://localhost:3005/api/search | jq -e '
            [.[] | select(.uid == "weather-notify-delivery")] | length == 1
          '

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
