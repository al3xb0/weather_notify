services:
  postgres:
    image: postgres:16-alpine
    container_name: wn_postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      # Defaults are for local development only. Set POSTGRES_PASSWORD (and the
      # RabbitMQ pair below) in .env before this file goes anywhere public —
      # these ports are loopback-bound, which is a second line of defence, not
      # a reason to ship a known password.
      #
      # These apply at initdb only, i.e. the first start on an empty volume.
      # Changing POSTGRES_PASSWORD later leaves the role as it was; either run
      #   docker compose exec postgres psql -U weather -d weather_notify \
      #     -c "ALTER USER weather WITH PASSWORD 'new'"
      # or drop the volume with `docker compose down -v` (destroys the data).
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather}
      POSTGRES_DB: ${POSTGRES_DB:-weather_notify}
    ports:
      # Bound to loopback only — reachable for local tooling, never from the
      # public interface. Services talk to it over the internal compose network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Authenticates over TCP rather than asking whether the port answers.
      # pg_isready calls a server healthy whose credentials no longer match any
      # client — which is exactly what a changed password produces — and
      # dependents then crash-loop against a dependency compose reports as fine.
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$${POSTGRES_PASSWORD:-weather} psql -h 127.0.0.1 -U $${POSTGRES_USER:-weather} -d $${POSTGRES_DB:-weather_notify} -c 'SELECT 1' > /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wn_redis
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wn_rabbitmq
    restart: unless-stopped
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-weather}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-weather}
    volumes:
      # Enables rabbitmq_prometheus alongside the management plugin. Queue depth,
      # consumer count and unacked messages are the broker's own metrics — the
      # notifier has no business reporting them about itself — and this is the
      # broker offering them, not a sidecar guessing.
      - ./ops/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "127.0.0.1:5672:5672"
      # Management UI is dev-only — do NOT publish it in production.
      # - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  core-api:
    build:
      context: .
      args:
        APP: core-api
    container_name: wn_core_api
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-weather}:${POSTGRES_PASSWORD:-weather}@postgres:5432/${POSTGRES_DB:-weather_notify}?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-weather}:${RABBITMQ_PASSWORD:-weather}@rabbitmq:5672
    command: sh -c "npx prisma migrate deploy && node dist/apps/core-api/main"
    ports:
      # Loopback only — exposed to the internet through the Caddy reverse proxy
      # (TLS) in production, never directly. Use "3000:3000" for plain local dev.
      - "127.0.0.1:3000:3000"
    healthcheck:
      # Readiness, not liveness: dependents must wait until Postgres and Redis
      # are actually reachable, which /health (always 200) cannot tell them.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  watcher:
    build:
      context: .
      args:
        APP: watcher
    container_name: wn_watcher
    restart: unless-stopped
    mem_limit: 384m
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-weather}:${POSTGRES_PASSWORD:-weather}@postgres:5432/${POSTGRES_DB:-weather_notify}?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-weather}:${RABBITMQ_PASSWORD:-weather}@rabbitmq:5672
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      core-api:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  notifier:
    build:
      context: .
      args:
        APP: notifier
    container_name: wn_notifier
    restart: unless-stopped
    mem_limit: 384m
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-weather}:${POSTGRES_PASSWORD:-weather}@postgres:5432/${POSTGRES_DB:-weather_notify}?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-weather}:${RABBITMQ_PASSWORD:-weather}@rabbitmq:5672
    # Long enough for the consumer to cancel, drain in-flight deliveries and
    # close the channel (see DRAIN_TIMEOUT_MS) before SIGKILL.
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Everything else in this stack is built so a *message* survives a crash. None
  # of it survives losing the volume, which on a single VM is the failure that
  # ends the service — so the schedule ships with the stack rather than living
  # in a host crontab nobody reprovisions.
  db-backup:
    build:
      context: ./scripts/backup
    container_name: wn_db_backup
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_DB: ${POSTGRES_DB:-weather_notify}
      PGPASSWORD: ${POSTGRES_PASSWORD:-weather}
      BACKUP_INTERVAL_SEC: ${BACKUP_INTERVAL_SEC:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Unset means local-only, which survives a dropped table but not a lost
      # VM. Set it, with the credentials below, for that to be a real DR plan.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      # S3-compatible object storage (Backblaze B2, Cloudflare R2, MinIO).
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
    volumes:
      # A named volume rather than a bind mount so the dumps survive
      # `docker compose down` — the moment they are most likely to be wanted.
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # The services have exposed Prometheus metrics all along; nothing scraped
  # them, which made the whole metric surface a design rather than something
  # anyone could look at. These two close that gap, and the alert rules turn
  # `watcher_outbox_pending` from a documented suggestion into a real page.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: wn_prometheus
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Local retention only. This is not a long-term metrics store, and on a
      # small VM an unbounded TSDB is the next thing to fill the disk.
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      # Loopback only, like the rest of the infra. Reach it over an SSH tunnel
      # rather than publishing an unauthenticated query interface.
      - "127.0.0.1:9090:9090"
    depends_on:
      core-api:
        condition: service_started

  grafana:
    image: grafana/grafana:11.5.1
    container_name: wn_grafana
    restart: unless-stopped
    mem_limit: 384m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Nothing here is meant to be reachable anonymously, and the instance sits
      # behind loopback anyway.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3005:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  pgdata:
  backups:
  promdata:
  grafanadata:
