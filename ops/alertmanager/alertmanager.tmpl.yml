# Rendered at container start by entrypoint.sh, which substitutes the ${...}
# placeholders from the environment. Alertmanager does not expand environment
# variables in its own config, and the alternative — committing an address and
# an SMTP host — is how a fork ends up mailing someone else's inbox.
global:
  resolve_timeout: 5m
  smtp_from: '${ALERT_EMAIL_FROM}'
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASS}'
  smtp_require_tls: ${SMTP_REQUIRE_TLS}

route:
  # One group per alert name and service, so a broker outage that trips several
  # rules at once arrives as one message rather than as five.
  group_by: ['alertname', 'service']
  # Long enough to collect the related alerts a single incident produces,
  # short enough that the first notification is not stale on arrival.
  group_wait: 30s
  group_interval: 5m
  # Nothing here self-corrects quietly, so a still-firing alert is worth a
  # reminder — but four hours, not four minutes.
  repeat_interval: 4h
  receiver: default

  routes:
    # Critical is "the process is gone and not coming back": it should not wait
    # for the group timer, and it should keep reminding sooner.
    - matchers:
        - severity = "critical"
      receiver: default
      group_wait: 10s
      repeat_interval: 1h
    # Informational rules describe efficiency, not breakage. They are visible in
    # the UI and deliberately do not page.
    - matchers:
        - severity = "info"
      receiver: silent

receivers:
  - name: default
${RECEIVER_BODY}

  # Terminates the route without notifying — the alert still shows as firing.
  - name: silent

inhibit_rules:
  # A service that is down will also stop reporting its queue depth and its
  # cycle duration. Those alerts are consequences, and sending them alongside
  # the cause is how a single failure turns into a wall of noise.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['service']
