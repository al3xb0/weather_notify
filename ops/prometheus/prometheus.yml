# Scrapes the three services over the internal compose network. Each exposes
# /metrics on its own unpublished port, so nothing here is reachable from the
# public interface — Prometheus reaches them by service name.
global:
  # Under the watcher's default five-minute cycle a 15s interval oversamples
  # heavily, but the notifier's counters move per delivery and the API's
  # histogram moves per request. Sampling for the fastest signal keeps the
  # slowest one merely redundant, which is the cheaper mistake.
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: core-api
    static_configs:
      - targets: ['core-api:3004']
        labels:
          service: core-api

  - job_name: watcher
    static_configs:
      - targets: ['watcher:3002']
        labels:
          service: watcher

  - job_name: notifier
    static_configs:
      - targets: ['notifier:3003']
        labels:
          service: notifier

  # Queue depth, consumer count and unacked messages come from the broker's own
  # rabbitmq_prometheus plugin rather than from the notifier, which has no
  # vantage point on the queues it is not consuming.
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          service: rabbitmq

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
